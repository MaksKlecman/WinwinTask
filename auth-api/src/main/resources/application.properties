spring.application.name=auth-api
jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-jwt-signing-please-change-it-in-prod}
jwt.expiration=${JWT_EXPIRATION:3600000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
server.port=${SERVER_PORT:8082}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
internal.token=${INTERNAL_TOKEN:local-dev-secret}
data-api.url=${DATA_API_URL:http://localhost:8081}